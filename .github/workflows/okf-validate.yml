# Required status check for main. Pre-commit hooks can be skipped locally; this cannot.
name: okf-validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  TOOLS: bundles/rsgx-ai-programme/tools
  GITLEAKS_VERSION: "8.30.1"   # verified 2026-09-30; bump deliberately, not automatically
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml

      - name: OKF v0.2 conformance and house format rules
        run: |
          for b in bundles/*/; do
            echo "::group::validate ${b%/}"
            python "$TOOLS/validate_okf.py" "${b%/}"
            echo "::endgroup::"
          done

      - name: Index files are up to date
        run: |
          for b in bundles/*/; do python "$TOOLS/build_index.py" "${b%/}"; done
          if ! git diff --quiet -- bundles; then
            git diff --stat -- bundles
            echo "::error::index.md files are stale. Run build_index.py and commit the result."
            exit 1
          fi

      - name: Governance rules (provenance, ratification, shelf life, placeholders)
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          for b in bundles/*/; do
            if [ -n "$BASE" ]; then
              python "$TOOLS/check_governance.py" "${b%/}" --changed-from "$BASE"
            else
              python "$TOOLS/check_governance.py" "${b%/}"
            fi
          done

      - name: Secret scan (full history)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
